name: 'Huge Hello World Action'
description: 'A hello-world action that is intentionally large (~100MB) for testing purposes'
inputs:
  name:
    description: 'Who to greet'
    required: false
    default: 'World'
outputs:
  greeting:
    description: 'The greeting message'
    value: ${{ steps.hello.outputs.greeting }}
runs:
  using: 'composite'
  steps:
    - id: hello
      run: |
        GREETING="Hello, ${{ inputs.name }}!"
        echo "$GREETING"
        echo "greeting=$GREETING" >> "$GITHUB_OUTPUT"
      shell: bash
